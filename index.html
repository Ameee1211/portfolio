<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tong Zhang (Amy) — UI/UX Designer Portfolio</title>
  <meta name="description" content="Portfolio of Tong Zhang (Amy), UI/UX Designer and Design Computing student at the University of Sydney." />
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=151" />
</head>
<body>

  <!-- ================= 导航 ================= -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="index.html"></a>
      <nav class="nav__links" id="navLinks"></nav>
      <button class="nav__burger" id="navBurger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <!-- ================= 首屏：字母迷宫 ================= -->
    <section class="hero" id="home">
      <div class="hero__veil hero__veil--top" aria-hidden="true"></div>
      <div class="hero__veil hero__veil--bottom" aria-hidden="true"></div>
      <div class="hero__inner">
        <div class="wordsearch" id="wordSearch"></div>
        <div class="hero__seam" aria-hidden="true"></div>
      </div>
    </section>

    <!-- ================= About Me ================= -->
    <section class="about" id="about">
      <div class="about__inner">
        <div class="about__left reveal">
          <div class="about__stage" id="aboutStage">
            <span class="about__blob" aria-hidden="true"></span>
            <span class="about__ring" aria-hidden="true"></span>
            <span class="about__spark about__spark--1" aria-hidden="true"></span>
            <span class="about__spark about__spark--2" aria-hidden="true"></span>
            <div class="about__photo" id="aboutPhotoWrap">
              <img id="aboutPhoto" src="" alt="Portrait of Amy" />
              <span class="about__glare" aria-hidden="true"></span>
            </div>
          </div>
          <h2 class="about__title" id="aboutTitle"></h2>
          <a class="btn btn--purple about__btn" id="aboutBtn" href="#"></a>
        </div>
        <div class="about__right reveal">
          <dl class="about__info" id="aboutInfo"></dl>
          <p class="about__intro" id="aboutIntro"></p>
          <div class="skills">
            <h3 class="skills__title" id="skillsTitle"></h3>
            <div class="skills__row" id="skillsRow"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= Featured Projects ================= -->
    <section class="projects" id="projects">
      <!-- 手机端：静态标题（电脑端隐藏） -->
      <div class="projects__head" id="projectsHead"></div>
      <!-- 电脑端：标题带，第一条从右边滑进来，之后一直往左流 -->
      <div class="projects__marquee" id="projectsMarquee" role="img" aria-label="Featured Projects — Behind every design is a story"></div>

      <div class="pdeck" id="deckStage"></div>
      <div class="pdeck__tags" id="deckTags"></div>
    </section>
    <!-- 转场专用卡片：About 的照片翻面变成 SunLink 的卡片，平时不可见 -->
    <div class="abcard" id="aboutCard" aria-hidden="true">
      <div class="abcard__inner" id="aboutCardInner">
        <div class="abcard__face abcard__front">
          <img id="aboutCardImg" src="" alt="" />
        </div>
        <div class="abcard__face abcard__back" id="aboutCardBack"></div>
      </div>
    </div>
  </main>

  <!-- 四屏转场的滚动轨道：只提供滚动距离，本身不显示任何内容 -->
  <div class="hs-stage" aria-hidden="true"></div>

  <script src="js/content.js?v=151"></script>
  <script src="js/main.js?v=151"></script>
</body>
</html>
