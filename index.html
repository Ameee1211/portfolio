<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tong Zhang (Amy) — UI/UX Designer Portfolio</title>
  <meta name="description" content="Portfolio of Tong Zhang (Amy), UI/UX Designer and Design Computing student at the University of Sydney." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ================= 导航 ================= -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="#home" id="navBrand"></a>
      <nav class="nav__links" id="navLinks">
        <!-- 由 js/main.js 生成 -->
      </nav>
      <a class="nav__cta" id="navCta" href="#projects"></a>
      <button class="nav__burger" id="navBurger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ================= 首屏 Hero ================= -->
  <section class="hero" id="home">
    <div class="hero__inner">
      <div class="hero__text">
        <p class="hero__greeting" id="heroGreeting"></p>
        <h1 class="hero__name" id="heroName"></h1>
        <p class="hero__role">
          <span id="heroRole"></span>
          <span class="hero__subrole" id="heroSubrole"></span>
        </p>
        <p class="hero__slogan" id="heroSlogan"></p>
        <div class="hero__meta">
          <span class="badge" id="heroBadge"></span>
        </div>
      </div>
      <div class="hero__photo">
        <div class="hero__photo-frame">
          <img id="heroPhoto" src="" alt="Portrait of Amy" />
        </div>
        <div class="hero__photo-blob" aria-hidden="true"></div>
      </div>
    </div>
    <a class="hero__scroll" href="#projects" id="heroScroll">
      <span id="heroScrollText"></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v16m0 0l-6-6m6 6l6-6"/></svg>
    </a>
  </section>

  <!-- ================= 精选项目 ================= -->
  <section class="projects" id="projects">
    <div class="section-head">
      <h2 class="section-head__title">Featured Projects</h2>
      <p class="section-head__line" aria-hidden="true"></p>
    </div>
    <div class="projects__grid" id="projectsGrid">
      <!-- 由 js/main.js 生成 -->
    </div>
  </section>

  <!-- ================= 过渡语段 ================= -->
  <section class="story" id="story">
    <h2 class="story__title" id="storyTitle"></h2>
    <p class="story__text" id="storyText"></p>
  </section>

  <!-- ================= 关于我简版 ================= -->
  <section class="about" id="about">
    <h2 class="about__heading" id="aboutHeading"></h2>
    <div class="about__lines" id="aboutLines"></div>
  </section>

  <!-- ================= 页脚 ================= -->
  <footer class="footer">
    <a class="footer__email" id="footerEmail" href="#"></a>
    <p class="footer__note" id="footerNote"></p>
    <p class="footer__copy" id="footerCopy"></p>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
