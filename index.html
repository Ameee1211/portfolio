<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tong Zhang (Amy) — UI/UX Designer Portfolio</title>
  <meta name="description" content="Portfolio of Tong Zhang (Amy), UI/UX Designer and Design Computing student at the University of Sydney." />
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=50" />
</head>
<body>

  <!-- ================= 导航 ================= -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="index.html"></a>
      <nav class="nav__links" id="navLinks"></nav>
      <button class="nav__burger" id="navBurger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <!-- ================= 首屏：字母迷宫 ================= -->
    <section class="hero" id="home">
      <div class="hero__inner">
        <div class="wordsearch" id="wordSearch"></div>
        <a class="scrollcue hero__cue" href="#about" aria-label="Scroll down to explore more">
          <span class="scrollcue__txt">Scroll down to explore more</span>
          <span class="scrollcue__line" aria-hidden="true"><i></i></span>
        </a>
      </div>
    </section>

    <!-- ================= About Me ================= -->
    <section class="about" id="about">
      <div class="about__inner">
        <div class="about__left reveal">
          <div class="about__stage" id="aboutStage">
            <span class="about__blob" aria-hidden="true"></span>
            <span class="about__ring" aria-hidden="true"></span>
            <span class="about__spark about__spark--1" aria-hidden="true"></span>
            <span class="about__spark about__spark--2" aria-hidden="true"></span>
            <div class="about__photo" id="aboutPhotoWrap">
              <img id="aboutPhoto" src="" alt="Portrait of Amy" />
              <span class="about__glare" aria-hidden="true"></span>
            </div>
          </div>
          <h2 class="about__title" id="aboutTitle"></h2>
          <a class="btn btn--purple about__btn" id="aboutBtn" href="#"></a>
        </div>
        <div class="about__right reveal">
          <dl class="about__info" id="aboutInfo"></dl>
          <p class="about__intro" id="aboutIntro"></p>
          <div class="skills">
            <h3 class="skills__title" id="skillsTitle"></h3>
            <div class="skills__row" id="skillsRow"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= Featured Projects ================= -->
    <section class="projects" id="projects">
      <div class="projects__head">
        <h2 class="projects__title" id="projectsTitle"></h2>
        <span class="projects__rule" aria-hidden="true"></span>
        <div class="projects__intro" id="projectsIntro"></div>
      </div>
      <div class="projects__grid" id="projectsGrid"></div>
    </section>
  </main>

  <!-- ================= 页脚 ================= -->
  <footer class="footer" id="contact">
    <div class="footer__banner">
      <p class="footer__thanks" id="footerThanks"></p>
      <p class="footer__note" id="footerNote"></p>
      <div class="footer__contact">
        <a class="footer__link" id="footerEmail" href="#"></a>
        <a class="footer__link" id="footerPhone" href="#"></a>
      </div>
    </div>
    <div class="footer__bar">
      <span id="footerCopy"></span>
    </div>
  </footer>

  <script src="js/content.js?v=50"></script>
  <script src="js/main.js?v=50"></script>
</body>
</html>
